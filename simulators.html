<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');
  :root{
    --bg:#070b16; --bg2:#0b1224;
    --ink:#eaf0ff; --ink-dim:#b7c2dc; --ink-faint:#7c88a6;
    --line:rgba(120,140,190,.16); --line-strong:rgba(140,165,220,.34);

    --cyan:#7fb7ff;
    --font-serif:'Noto Serif KR',serif; --font-sans:'Noto Sans KR',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--font-sans);color:var(--ink);
    background:
      radial-gradient(1100px 600px at 50% -8%,rgba(60,90,170,.18),transparent 60%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 1.5rem}

  /* HEADER */
  .top{padding:3.2rem 0 1.6rem;text-align:center;position:relative}
  .top__back{position:absolute;left:1.5rem;top:3.4rem;font-size:.85rem;color:var(--ink-faint);text-decoration:none;transition:color .25s}
  .top__back:hover{color:var(--cyan)}
  .top__kicker{font-size:.8rem;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:.9rem}
  .top__title{font-family:var(--font-serif);font-weight:700;font-size:clamp(2rem,5vw,3rem);letter-spacing:-.01em}
  .top__sub{margin-top:.9rem;color:var(--ink-dim);font-size:1rem}
  .top__count{margin-top:.5rem;color:var(--ink-faint);font-size:.85rem}

  /* CHAPTER NAV */
  .nav{position:sticky;top:0;z-index:20;background:rgba(7,11,22,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin-top:1.4rem}
  .nav__inner{display:flex;gap:.5rem;overflow-x:auto;padding:.7rem 1.5rem;max-width:1080px;margin:0 auto;scrollbar-width:thin}
  .nav a{white-space:nowrap;font-size:.82rem;color:var(--ink-faint);text-decoration:none;padding:.35rem .8rem;border-radius:999px;border:1px solid transparent;transition:all .22s}
  .nav a:hover{color:var(--ink);border-color:var(--line-strong);background:rgba(127,183,255,.08)}

  /* CHAPTER */
  .chapter{padding-top:3rem;scroll-margin-top:3.6rem}
  .chapter__head{display:flex;align-items:baseline;gap:.9rem;padding-bottom:1.1rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .chapter__no{font-family:var(--font-serif);font-size:1rem;color:var(--accent,var(--cyan));letter-spacing:.06em;font-weight:700}
  .chapter__name{font-family:var(--font-serif);font-weight:700;font-size:clamp(1.35rem,3.4vw,1.85rem)}
  .chapter__badge{margin-left:auto;font-size:.75rem;color:var(--ink-faint);border:1px solid var(--line-strong);border-radius:999px;padding:.2rem .7rem;white-space:nowrap}

  /* GRID */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.9rem;padding-top:1.5rem}
  .sim{
    position:relative;display:flex;flex-direction:column;gap:.45rem;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:1.1rem 1.15rem 1rem;text-decoration:none;color:inherit;overflow:hidden;
    transition:border-color .3s,background .3s,transform .3s,box-shadow .3s;
  }
  .sim::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--cyan));opacity:.5;transition:opacity .3s}
  .sim:hover{border-color:var(--line-strong);background:var(--card-hover);transform:translateY(-3px);box-shadow:0 16px 42px -26px rgba(0,0,0,.85)}
  .sim:hover::before{opacity:1}
  .sim__name{font-family:var(--font-serif);font-weight:700;font-size:1.06rem;letter-spacing:-.01em;line-height:1.35}
  .sim__desc{font-size:.82rem;color:var(--ink-faint);line-height:1.5;flex:1}
  .sim__go{margin-top:.3rem;font-size:.8rem;color:#cfe2ff;font-weight:500;opacity:.85;transition:opacity .25s,transform .25s}
  .sim:hover .sim__go{opacity:1;transform:translateX(2px)}

  .foot{margin-top:5rem;padding:3rem 1.5rem 4rem;text-align:center;border-top:1px solid var(--line);color:var(--ink-faint);font-size:.82rem;letter-spacing:.06em}

  @media (max-width:520px){
    .top__back{position:static;display:inline-block;margin-bottom:1rem}
    .grid{grid-template-columns:1fr}
  }
</style>

      card.className = 'sim';
      card.href = ch.page + '#' + id;
      card.target = '_blank';
      card.rel = 'noopener';
      card.style.setProperty('--accent', ch.accent);
      card.innerHTML =
        '<span class="sim__name">' + name + '</span>' +
        '<span class="sim__desc">' + desc + '</span>' +
        '<span class="sim__go">열기 →</span>';
      grid.appendChild(card);
    });
    app.appendChild(sec);
  });
  document.getElementById('totalCount').textContent = '전체 ' + total + '개 시뮬레이터 · 7개 차시';
})();
</script>
